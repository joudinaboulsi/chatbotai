# Local development stack. Frontend runs via `npm run dev` (Vite) outside
# Docker for fast HMR; this compose file covers the backend + its
# infrastructure dependencies. See docker-compose.prod.yml for the
# production topology (frontend containerized behind nginx too).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    ports:
      # Host port 5433, not 5432: an unrelated project's Postgres container
      # already holds 5432 on this box. Internal traffic still uses
      # postgres:5432 inside the compose network, so this only affects
      # direct host-side access (e.g. psql/DBeaver from Windows).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chatbot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/chatbot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

volumes:
  postgres_data:
  storage_data:
